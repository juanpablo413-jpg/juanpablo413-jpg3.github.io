<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voto</title>
    <script src="../js/funciones.js"></script>
    <link rel="stylesheet" href="../css/estilo.css" type="text/css">
</head>
<body>
    <nav id="menuPrincipal">
        <h1>
            <a class="opcionMenuPrincipal" href="../index.html">Inicio</a>
        </h1>
    </nav>
    <section class="contenido quienessomos">

        <article id="Voto" class="contenedor">
            <h3>Voto por sección</h3>
            <form action="">
                <p>¿De qué sección de la ciudad eres?</p>
                <select id="seccion">
                    <option value="Norte">Norte</option>
                    <option value="Sur">Sur</option>
                    <option value="Centro">Centro</option>
                </select>
                <p>¿Por quién quieres votar?</p>
                <select id="candidato">
                    <option value="A">Candidato A</option>
                    <option value="B">Candidato B</option>
                    <option value="C">Candidato C</option>
                </select>
            </form>
            <input type="button" value="Votar" onclick="votar()">
        </article>

        <p id="resultado">Aqui estan los Resultados</p>
    </section>

</body>
</html>
